name: Build and Push Docker Image

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: checKout code
              uses: actions/checkout@v7

            - name: login in to docker hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and push docker image
              env:
                REPOSITORY: nginx
                IMAGE_TAG: latest
              run: |
                docker build -t ${{ secrets.DOCKERHUB_USER }}/$REPOSITORY:$IMAGE_TAG .
                docker push ${{ secrets.DOCKERHUB_USER }}/$REPOSITORY:$IMAGE_TAG 



        
        
        
