name: Build and Push Docker Image

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

    build-and-push:
        runs-on: ubuntu-latest
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USER || vars.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}

        steps:
            - name: checKout code
              uses: actions/checkout@v7

            - name: login in to docker hub
              uses: docker/login-action@v4
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and push docker image
              env:
                REPOSITORY: nginx
                IMAGE_TAG: latest
              run: |
                docker build -t ${{ env.DOCKERHUB_USERNAME }}/$REPOSITORY:$IMAGE_TAG .
                docker push ${{ env.DOCKERHUB_USERNAME }}/$REPOSITORY:$IMAGE_TAG 



        
        
        
